# 右 = peripheral。moNa2 の config/mona2_l.conf を土台にしている。

CONFIG_ZMK_BLE=y
CONFIG_NFCT_PINS_AS_GPIOS=y

CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=3
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=3

# ── トラックボール (cormoran 版 PMW3610) ──
CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_ZMK_POINTING=y
CONFIG_PMW3610=y
CONFIG_PMW3610_REPORT_INTERVAL_MIN=15
CONFIG_PMW3610_REST2_DOWNSHIFT_TIME_MS=600000
CONFIG_PMW3610_REST3_SAMPLE_TIME_MS=100
# ★実機未確認★ 公式 (badjeff 版) は INVERT_X=n。換算の理由は left.conf を参照。
# overlay 側の zip_xy_transform (Y 反転) は公式のまま残している。
CONFIG_PMW3610_INVERT_X=y
CONFIG_PMW3610_INVERT_Y=y

# ── BLE ──
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_BT_MAX_PAIRED=6
CONFIG_BT_MAX_CONN=6
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
CONFIG_BT_CTLR_PHY_2M=n
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n

# ── 電源 / 電池 ──
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=9000000
CONFIG_ZMK_PM_SOFT_OFF=y
CONFIG_ZMK_BATTERY_REPORTING=y

# ── DYA Studio (peripheral 側に必要な分) ──
CONFIG_ZMK_SETTINGS_RPC=y
CONFIG_ZMK_WATCHDOG=y
CONFIG_ZMK_SPLIT_RELAY_EVENT=y
CONFIG_ZMK_SPLIT_RELAY_EVENT_DATA_LEN=256
CONFIG_ZMK_KSCAN_DIAGNOSTICS=y
CONFIG_ZMK_KSCAN_DIAGNOSTICS_MAX_POSITIONS=48
CONFIG_SETTINGS=y
CONFIG_ZMK_SETTINGS_SAVE_DEBOUNCE=10000
