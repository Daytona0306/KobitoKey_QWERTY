# 右 = peripheral。moNa2 の config/mona2_l.conf を土台にしている。

CONFIG_ZMK_BLE=y
CONFIG_NFCT_PINS_AS_GPIOS=y

CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=3
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=3

# ── トラックボール (cormoran 版 PMW3610) ──
CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_ZMK_POINTING=y
CONFIG_PMW3610=y
CONFIG_PMW3610_REPORT_INTERVAL_MIN=15
CONFIG_PMW3610_REST2_DOWNSHIFT_TIME_MS=600000
CONFIG_PMW3610_REST3_SAMPLE_TIME_MS=100
# 公式 (badjeff 版) と同じ値にする (理由は left.conf)。
# overlay 側の zip_xy_transform (Y 反転) は公式のまま残している。
CONFIG_PMW3610_INVERT_X=n
CONFIG_PMW3610_INVERT_Y=n

# ── BLE ──
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_BT_MAX_PAIRED=6
CONFIG_BT_MAX_CONN=6
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
CONFIG_BT_CTLR_PHY_2M=n
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n

# ── 電源 / 電池 ──
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=9000000
CONFIG_ZMK_PM_SOFT_OFF=y
CONFIG_ZMK_BATTERY_REPORTING=y

# ── DYA Studio (peripheral 側に必要な分) ──
CONFIG_ZMK_SETTINGS_RPC=y
CONFIG_ZMK_WATCHDOG=y
CONFIG_ZMK_SPLIT_RELAY_EVENT=y
# 256 にしない (理由は left.conf)。左右で同じ値にすること。
CONFIG_ZMK_SPLIT_RELAY_EVENT_DATA_LEN=240

# ── 右ボールの入力を左へ送るスレッドのスタック ──
# relay を有効にすると、split の送信イベント (zmk_split_transport_peripheral_event) が
# relay のペイロードぶん大きくなる。右ボールの入力は input スレッド上でこれを組み立てて
# bt_gatt_notify まで呼ぶので、既定の 1024 では足りずスレッドが落ちる
# (キーは効くのに右ボールだけ無反応になっていた。2048 にして実機で直った)。GeaconSolstice (同じ
# cormoran 系 + BLE split + 右にトラックボール) も peripheral 側の通知スタックを広げている。
CONFIG_INPUT_THREAD_STACK_SIZE=2048
CONFIG_ZMK_SPLIT_BLE_PERIPHERAL_STACK_SIZE=2048
CONFIG_ZMK_KSCAN_DIAGNOSTICS=y
CONFIG_ZMK_KSCAN_DIAGNOSTICS_MAX_POSITIONS=48
CONFIG_SETTINGS=y
CONFIG_ZMK_SETTINGS_SAVE_DEBOUNCE=10000

# ── このセンサーの設定を DYA Studio から変えるための中継 (説明は left.conf) ──
CONFIG_ZMK_CUSTOM_SETTINGS=y
CONFIG_ZMK_CUSTOM_SETTINGS_SPLIT_RPC_RELAY=y
CONFIG_ZMK_PMW3610_CUSTOM_SETTINGS=y
CONFIG_ZMK_PMW3610_SPLIT_RPC_RELAY=y
# 中継の処理は low-priority ワークキューで走る。既定のままだとスタックが足りない
# (ドライバ側で実機のスタックオーバーフローが確認されている)。
CONFIG_ZMK_LOW_PRIORITY_THREAD_STACK_SIZE=4096

# ── 充電ランプ (modules/charge-indicator) ──
# 充電中だけ、この半分の LED を電池残量の色で点ける (レイヤー表示より優先)。
# 満充電で充電が止まると消え、普段の表示 (rgbled-widget) に戻る。
#   80% 以上 = 緑 / 20〜80% = 黄 / 20% 未満 = 赤
CONFIG_CHARGE_INDICATOR=y
CONFIG_CHG_BATTERY_LEVEL_HIGH=80
CONFIG_CHG_BATTERY_LEVEL_LOW=20
CONFIG_CHG_BATTERY_COLOR_HIGH=2
CONFIG_CHG_BATTERY_COLOR_MEDIUM=3
CONFIG_CHG_BATTERY_COLOR_LOW=1
CONFIG_CHG_BATTERY_COLOR_CRITICAL=1
