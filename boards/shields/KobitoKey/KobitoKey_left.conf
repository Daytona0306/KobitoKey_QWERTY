# 左 = central。moNa2 の config/mona2_r.conf を土台にしている。
# 各項目の経緯は moNa2 側のコメントと README を参照。

CONFIG_ZMK_KEYBOARD_NAME="KobitoKey"
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y
CONFIG_ZMK_BLE=y
CONFIG_NFCT_PINS_AS_GPIOS=y

CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=3
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=3

# ── トラックボール (cormoran 版 PMW3610) ──
CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_ZMK_POINTING=y
CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=y
CONFIG_PMW3610=y
CONFIG_PMW3610_REPORT_INTERVAL_MIN=15
CONFIG_PMW3610_REST2_DOWNSHIFT_TIME_MS=600000
CONFIG_PMW3610_REST3_SAMPLE_TIME_MS=100
# 公式 (badjeff 版) と同じ値にする。
# badjeff 版はセンサーのレジスタで、cormoran 版はソフトで軸を反転するが、結果は同じ。
# moNa2 の「X/Y とも逆になった」はチェーン上の zip_xy_transform (X|Y 反転) の
# 打ち消しで、ドライバの差ではない。KobitoKey のチェーンには transform が無いので、
# moNa2 の値 (X=n, Y=y) を写すと上下左右とも逆になる (実機で確認済み)。
CONFIG_PMW3610_INVERT_X=y
CONFIG_PMW3610_INVERT_Y=n
CONFIG_ZMK_PMW3610_STUDIO_RPC=y
CONFIG_ZMK_PMW3610_CUSTOM_SETTINGS=y

# ── BLE ──
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_BT_MAX_PAIRED=6
CONFIG_BT_MAX_CONN=6
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
CONFIG_USB_HID_POLL_INTERVAL_MS=1
CONFIG_BT_CTLR_PHY_2M=n
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n

# ── 電源 / 電池 ──
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=9000000
CONFIG_ZMK_PM_SOFT_OFF=y
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

# ── LED (公式のまま) ──
CONFIG_RGBLED_WIDGET=y
CONFIG_RGBLED_WIDGET_INTERVAL_MS=1000
CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_HIGH=60
CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_LOW=30
CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_CRITICAL=10
CONFIG_RGBLED_WIDGET_SHOW_LAYER_COLORS=y
CONFIG_RGBLED_WIDGET_LAYER_0_COLOR=0
CONFIG_RGBLED_WIDGET_LAYER_1_COLOR=4
CONFIG_RGBLED_WIDGET_LAYER_2_COLOR=4
CONFIG_RGBLED_WIDGET_LAYER_3_COLOR=6
CONFIG_RGBLED_WIDGET_LAYER_4_COLOR=4

# ── ZMK Studio / DYA Studio ──
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=y
CONFIG_ZMK_BEHAVIOR_LOCAL_ID_TYPE_CRC16=y
CONFIG_ZMK_BEHAVIOR_LOCAL_IDS_IN_BINDINGS=y
CONFIG_ZMK_BLE_MANAGEMENT=y
CONFIG_ZMK_BLE_MANAGEMENT_STUDIO_RPC=y
CONFIG_ZMK_SETTINGS_RPC=y
CONFIG_ZMK_SETTINGS_RPC_STUDIO=y
CONFIG_ZMK_RUNTIME_INPUT_PROCESSOR=y
CONFIG_ZMK_RUNTIME_INPUT_PROCESSOR_STUDIO_RPC=y
CONFIG_ZMK_SPLIT_RELAY_EVENT=y
# 256 にしない。relay の event_data_size は uint8_t なので 256 は 0 に桁あふれする
# (ビルドで -Woverflow が出ていた)。GeaconSolstice と同じ 240 にする。左右で同じ値にすること。
CONFIG_ZMK_SPLIT_RELAY_EVENT_DATA_LEN=240
CONFIG_ZMK_SPLIT_BLE_CENTRAL_SPLIT_RUN_STACK_SIZE=3096
CONFIG_SETTINGS=y
CONFIG_ZMK_SETTINGS_SAVE_DEBOUNCE=10000
CONFIG_ZMK_CUSTOM_SETTINGS=y
CONFIG_ZMK_CUSTOM_SETTINGS_STUDIO_RPC=y
CONFIG_ZMK_CUSTOM_SETTINGS_LARGE_VALUE_MAX_SIZE=256
CONFIG_ZMK_RUNTIME_COMBO=y
CONFIG_ZMK_RUNTIME_COMBO_STUDIO_RPC=y
CONFIG_ZMK_RUNTIME_COMBO_MAX_COMBOS=16
CONFIG_ZMK_RUNTIME_COMBO_DEFAULT_TIMEOUT_MS=50
CONFIG_ZMK_RUNTIME_MACRO=y
CONFIG_ZMK_RUNTIME_MACRO_STUDIO_RPC=y
CONFIG_ZMK_RUNTIME_MACRO_COUNT=8
CONFIG_ZMK_RUNTIME_MACRO_POOL_BYTES=1024
CONFIG_ZMK_RUNTIME_MACRO_MAX_BYTES=256
CONFIG_ZMK_SETTING_EXPOSE=y
CONFIG_ZMK_KSCAN_DIAGNOSTICS=y
CONFIG_ZMK_KSCAN_DIAGNOSTICS_STUDIO_RPC=y
CONFIG_ZMK_KSCAN_DIAGNOSTICS_MAX_POSITIONS=48
CONFIG_ZMK_INPUT_STREAM_FEATURE=y
CONFIG_ZMK_INPUT_STREAM_FEATURE_STUDIO_RPC=y
CONFIG_ZMK_DEVTOOL=y
CONFIG_ZMK_DEVTOOL_STUDIO_RPC=y
CONFIG_ZMK_DEVTOOL_STACK_USAGE=y
CONFIG_ZMK_DEVICE_INFO=y
CONFIG_ZMK_DEVICE_INFO_STUDIO_RPC=y
CONFIG_ZMK_WATCHDOG=y
CONFIG_ZMK_WATCHDOG_STUDIO_RPC=y
CONFIG_ZMK_STUDIO_RPC_PERF=y
CONFIG_ZMK_STUDIO_RPC_PERF_HANDLER=y
CONFIG_ZMK_STUDIO_RPC_RX_BUF_SIZE=512
CONFIG_ZMK_STUDIO_RPC_TX_BUF_SIZE=512
CONFIG_ZMK_STUDIO_RPC_CUSTOM_SUBSYSTEM_REQUEST_PAYLOAD_MAX_BYTES=512
CONFIG_ZMK_LOW_PRIORITY_THREAD_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_ZMK_STUDIO_RPC_THREAD_STACK_SIZE=6000

# ── 右 (peripheral) のセンサー設定を DYA Studio から変えるための中継 ──
# Studio は左 (central) にしかつながらないので、右ボールの CPI・軸反転・省電力時間
# などは中継しないと届かない。左右両方で有効にすること。
#   CUSTOM_SETTINGS_SPLIT_RPC_RELAY … 設定値の読み書き・保存 (これが本体)
#   PMW3610_SPLIT_RPC_RELAY         … センサーの検出・診断
# cormoran/zmk-keyboard-dya-dash や te9no/zmk-config-GeaconSolstice と同じ構成。
# ★実機未確認★ 右への設定書き込みと再起動後の保持は、ドライバ側でも未検証とされている。
CONFIG_ZMK_CUSTOM_SETTINGS_SPLIT_RPC_RELAY=y
CONFIG_ZMK_PMW3610_SPLIT_RPC_RELAY=y

# ── hold-tap / 慣性の実行時調整、RPC ジェスチャー ──
CONFIG_ZMK_HOLDTAP_RUNTIME=y
CONFIG_ZMK_INERTIA_RUNTIME=y
CONFIG_ZMK_MOUSE_GESTURE_RPC=y
CONFIG_ZMK_MOUSE_GESTURE_RPC_NUM_SETS=5

# ── OS ごとのデフォルトレイヤー (iPad レイヤー = index 1) ──
CONFIG_ZMK_DEFAULT_LAYER=y
CONFIG_ZMK_DEFAULT_LAYER_MIN_INDEX=1
CONFIG_ZMK_DEFAULT_LAYER_MAX_INDEX=1
CONFIG_ZMK_DEFAULT_LAYER_STUDIO_RPC=y
CONFIG_ZMK_DEFAULT_LAYER_OS_DETECTION=y
CONFIG_ZMK_OS_DETECTION=y
CONFIG_ZMK_OS_DETECTION_BLE=y
CONFIG_ZMK_OS_DETECTION_STUDIO_RPC=y
CONFIG_ZMK_OS_DETECTION_USB=n
