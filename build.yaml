# 左が central (Studio はこちらに USB 接続する)。
---
include:
  - board: xiao_ble/nrf52840/zmk
    shield: KobitoKey_left rgbled_adapter
    snippet: studio-rpc-usb-uart
    artifact-name: kobitokey_left
  - board: xiao_ble/nrf52840/zmk
    shield: KobitoKey_right rgbled_adapter
    artifact-name: kobitokey_right
  - board: xiao_ble/nrf52840/zmk
    shield: settings_reset
    artifact-name: kobitokey_reset
  # 調査用: 右をUSBにつなぐとログが見られる (シリアルモニタで開く)。
  # 普段使いは kobitokey_right。右ボールが動かないときの原因調べにだけ使う。
  - board: xiao_ble/nrf52840/zmk
    shield: KobitoKey_right rgbled_adapter
    snippet: zmk-usb-logging
    artifact-name: kobitokey_right_log
